# STREAM 배포 워크플로
#
# develop에 푸시되면 자동 배포된다.
#
# 설계 원칙 (docs/DEPLOY.md 참고):
#   - 프론트는 CI에서 빌드해 아티팩트로 전달한다. 서버에서 빌드하지 않는다.
#   - AWS 자격 증명을 저장하지 않는다. OIDC로 실행 시점에 역할을 빌린다.
#   - 배포에 인바운드 포트를 열지 않는다. SSM Run Command로 서버가 명령을 받아간다.
name: Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

# 동시 배포가 겹치면 서버 상태가 꼬이므로 한 번에 하나만 실행한다.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  BUCKET: stream-deploy-artifacts-820273519659-ap-northeast-2-an
  INSTANCE_ID: i-0088d4a02ab004057
  ROLE_ARN: arn:aws:iam::820273519659:role/stream-deploy
  APP_URL: http://3.34.82.68

permissions:
  id-token: write # OIDC 토큰 발급에 필요
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 프론트엔드 빌드
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: 아티팩트 패키징
        run: |
          mkdir -p pkg
          cp -r backend pkg/backend
          cp -r frontend/dist pkg/dist
          find pkg -name '__pycache__' -type d -prune -exec rm -rf {} +
          tar -czf artifact.tar.gz -C pkg .
          ls -lh artifact.tar.gz

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: S3 업로드
        id: upload
        run: |
          KEY="deploy/${GITHUB_SHA}.tar.gz"
          aws s3 cp artifact.tar.gz "s3://${BUCKET}/${KEY}"
          echo "key=${KEY}" >> "$GITHUB_OUTPUT"

      - name: SSM으로 배포 실행
        run: |
          {
            echo "BUCKET=${BUCKET}"
            echo "KEY=${{ steps.upload.outputs.key }}"
            echo "REGION=${AWS_REGION}"
            cat infra/ssm-deploy.sh
          } > remote.sh

          # SSM은 명령을 sh(dash)로 실행한다. 스크립트가 bash 문법(set -o pipefail 등)을
          # 쓰므로, base64로 실어 보낸 뒤 bash로 명시 실행한다. 셰방 위치에 의존하지 않는다.
          B64=$(base64 -w0 remote.sh)
          jq -n --arg c "echo ${B64} | base64 -d > /tmp/stream-deploy.sh && bash /tmp/stream-deploy.sh" \
            '{commands: [$c]}' > params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --parameters file://params.json \
            --timeout-seconds 900 \
            --query 'Command.CommandId' --output text)
          echo "CommandId: ${CMD_ID}"

          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${CMD_ID}" --instance-id "${INSTANCE_ID}" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "${STATUS}" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          echo "--- 서버 출력 ---"
          aws ssm get-command-invocation --command-id "${CMD_ID}" \
            --instance-id "${INSTANCE_ID}" --query StandardOutputContent --output text
          ERR=$(aws ssm get-command-invocation --command-id "${CMD_ID}" \
            --instance-id "${INSTANCE_ID}" --query StandardErrorContent --output text)
          if [ -n "${ERR}" ] && [ "${ERR}" != "None" ]; then
            echo "--- 오류 출력 ---"
            echo "${ERR}"
          fi

          echo "최종 상태: ${STATUS}"
          [ "${STATUS}" = "Success" ]

      - name: 헬스체크
        run: |
          for _ in $(seq 1 10); do
            WEB=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${APP_URL}/" || true)
            # /api/postings는 인증이 필요하므로 401이 정상(= 백엔드 살아 있음)
            API=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${APP_URL}/api/postings" || true)
            if [ "${WEB}" = "200" ] && [ "${API}" = "401" ]; then
              echo "✓ 배포 확인 — ${APP_URL}"
              exit 0
            fi
            sleep 3
          done
          echo "✗ 헬스체크 실패 (프론트 ${WEB} / API ${API})"
          exit 1
