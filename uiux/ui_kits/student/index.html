<!-- @dsCard group="Student Portal" viewport="1440x1024" subtitle="STREAM 학생 포털 — 교내 근로 지원 (SAINT 화면명세 기반)" name="Student Portal" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: var(--font-sans, 'Freesentation'), sans-serif; color: #1F2937; background: #F4F5F7; }
  button { font-family: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #D5D8DC; border-radius: 6px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<script src="../shared-posts-store.js"></script>
<script src="../shared-applicants-store.js"></script>
<script src="./student-data.js"></script>
<script type="text/babel" data-presets="react" src="./Shell.jsx"></script>
<script type="text/babel" data-presets="react" src="./PostListScreen.jsx"></script>
<script type="text/babel" data-presets="react" src="./PostDetailScreen.jsx"></script>
<script type="text/babel" data-presets="react" src="./ApplicationFormScreen.jsx"></script>
<script type="text/babel" data-presets="react" src="./MyApplicationsScreen.jsx"></script>
<script type="text/babel" data-presets="react" src="./ApplicationDetailScreen.jsx"></script>
<script type="text/babel" data-presets="react" src="./ProfileScreen.jsx"></script>
<script type="text/babel" data-presets="react" src="./LikedPostsScreen.jsx"></script>
<script type="text/babel" data-presets="react" src="./OtherScreens.jsx"></script>

<script type="text/babel" data-presets="react">
const { useState } = React;

function App() {
  const [menu, setMenu] = useState('posts');
  const [view, setView] = useState('list'); // list | detail | form | complete (within posts/apply/status)
  const [selectedPost, setSelectedPost] = useState(null);
  // '지원하기'로 선택한 공고 id — 지원서 작성 화면의 공고 선택 초기값으로 사용
  const [applyPostId, setApplyPostId] = useState(null);
  // 하트(관심 공고) 상태 — 공고 목록과 관심 공고 탭이 공유
  const [liked, setLiked] = useState(window.likedDefault || {});
  const toggleLike = (id) => setLiked(m => ({ ...m, [id]: !m[id] }));

  // 관리자 콘솔에서 새 공고를 등록/저장하면 (다른 탭의 localStorage 변경) 즉시 공고 목록에 반영
  const [, forceUpdate] = useState(0);
  React.useEffect(() => {
    if (!window.SharedPostsStore) return;
    return window.SharedPostsStore.subscribe(() => {
      window.posts = window.mergeSharedPosts(window.streamBasePosts);
      forceUpdate(n => n + 1);
    });
  }, []);

  const go = (m) => { setMenu(m); setView(m === 'apply' ? 'form' : 'list'); };
  const goApply = (post) => { setApplyPostId(post ? post.id : null); setMenu('apply'); setView('form'); };

  let content;
  if (menu === 'posts') {
    if (view === 'detail') content = <window.PostDetailScreen post={selectedPost} onBack={() => setView('list')} onApply={() => goApply(selectedPost)} />;
    else content = <window.PostListScreen liked={liked} onToggleLike={toggleLike} onOpenDetail={(p) => { setSelectedPost(p); setView('detail'); }} onApply={goApply} />;
  } else if (menu === 'liked') {
    content = <window.LikedPostsScreen liked={liked} onToggleLike={toggleLike}
      onOpenDetail={(p) => { setSelectedPost(p); setMenu('posts'); setView('detail'); }}
      onApply={goApply}
      onBrowse={() => { setMenu('posts'); setView('list'); }} />;
  } else if (menu === 'apply') {
    content = <window.ApplicationFormScreen initialPostId={applyPostId} onBack={() => { setMenu('posts'); setView('list'); }} onGoStatus={() => { setMenu('status'); setView('list'); }} />;
  } else if (menu === 'status') {
    if (view === 'detail') content = <window.ApplicationDetailScreen onBack={() => setView('list')} />;
    else content = <window.MyApplicationsScreen onOpenDetail={() => setView('detail')} />;
  } else if (menu === 'profile') {
    content = <window.ProfileScreen onGoApply={goApply} />;
  } else if (menu === 'schedule') content = <window.ScheduleScreen />;
  else if (menu === 'substitute') content = <window.SubstituteScreen />;
  else if (menu === 'attendance') content = <window.AttendanceScreen />;

  return <window.Shell active={menu} onNavigate={go}>{content}</window.Shell>;
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
