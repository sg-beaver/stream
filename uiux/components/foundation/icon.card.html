<!-- @dsCard group="컴포넌트" viewport="700x220" name="아이콘 (Lucide)" subtitle="기관형 선 스타일의 Lucide 아이콘 세트" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style> body { margin: 0; padding: 24px; background: var(--surface-page); } </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Icon } = window.STREAMDesignSystem_b095d7;
  const sections = [
    { title: "업무", names: ["briefcase", "file-text", "calendar-days", "clipboard-check", "users"] },
    { title: "커뮤니케이션", names: ["bell", "search", "pencil", "message-square", "send"] },
    { title: "상태", names: ["check-circle-2", "alert-triangle", "clock", "inbox", "settings"] },
  ];
  function Demo() {
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        <div style={{ padding: "12px 13px", border: "1px solid var(--border-subtle)", borderRadius: "var(--radius-sm)", background: "var(--surface-card)" }}>
          <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: ".08em", textTransform: "uppercase", color: "var(--text-muted)", marginBottom: 6 }}>자주 쓰는 아이콘</div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, color: "var(--text-strong)" }}>
            <Icon name="briefcase" size={20} />
            <Icon name="calendar-days" size={20} />
            <Icon name="check-circle-2" size={20} />
            <span style={{ fontSize: 13, color: "var(--text-body)" }}>업무·일정·상태를 한눈에 보여 주는 선형 아이콘 세트</span>
          </div>
        </div>
        {sections.map(section => (
          <div key={section.title}>
            <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: ".08em", textTransform: "uppercase", color: "var(--text-muted)", marginBottom: 8 }}>{section.title}</div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 12 }}>
              {section.names.map(name => (
                <div key={name} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 6, width: 64 }}>
                  <span style={{ color: "var(--text-strong)" }}><Icon name={name} size={20} /></span>
                  <span style={{ fontSize: 10, color: "var(--text-muted)", textAlign: "center", lineHeight: 1.2 }}>{name}</span>
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
