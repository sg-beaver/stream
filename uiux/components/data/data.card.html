<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 24px; background: var(--surface-page); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 20px; }
  .lbl { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 10px; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 22px; max-width: 620px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Badge, StatusPill, Avatar, Table, StatCard, Pagination, Icon } = window.STREAMDesignSystem_b095d7;
  function Demo() {
    const [page, setPage] = React.useState(2);
    const rows = [
      { id: 1, name: "김민준", sid: "20241023", dept: "중앙도서관", status: "selected" },
      { id: 2, name: "이서연", sid: "20239981", dept: "IT 헬프데스크", status: "screening" },
      { id: 3, name: "박지호", sid: "20244412", dept: "입학처", status: "waitlist" },
    ];
    return (
      <div>
        <div style={{ padding: "12px 14px", border: "1px solid var(--border-subtle)", borderRadius: "var(--radius-md)", background: "var(--surface-card)", boxShadow: "var(--shadow-sm)", marginBottom: 16 }}>
          <div className="lbl" style={{ marginBottom: 6 }}>선발 현황 요약</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            <Badge tone="success" dot>선발 완료 12명</Badge>
            <Badge tone="warning">심사 중 4명</Badge>
            <Badge tone="info">대기 3명</Badge>
          </div>
        </div>

        <p className="lbl">배지</p>
        <div className="row">
          <Badge tone="neutral">일반</Badge>
          <Badge tone="brand">브랜드</Badge>
          <Badge tone="success" dot>활성</Badge>
          <Badge tone="warning">검토</Badge>
          <Badge tone="danger" variant="solid">지연</Badge>
          <Badge tone="info">정보</Badge>
        </div>

        <p className="lbl">상태 칩</p>
        <div className="row">
          <StatusPill status="open" />
          <StatusPill status="submitted" />
          <StatusPill status="selected" />
          <StatusPill status="waitlist" />
          <StatusPill status="present" />
          <StatusPill status="late" />
          <StatusPill status="absent" />
          <StatusPill status="pending" />
          <StatusPill status="approved" />
        </div>

        <p className="lbl">아바타</p>
        <div className="row">
          <Avatar name="김민준" />
          <Avatar name="이서연" shape="circle" />
          <Avatar name="박지호" size={44} />
        </div>

        <p className="lbl">통계 카드</p>
        <div className="kpis">
          <StatCard label="현재 근로 중" value="42" unit="명" delta="+6명 전주 대비" deltaTone="up" icon={<Icon name="users" size={18} />} />
          <StatCard label="모집 공고" value="7" delta="3건 마감 임박" deltaTone="neutral" icon={<Icon name="briefcase" size={18} />} />
          <StatCard label="결근률" value="2.4" unit="%" delta="-0.5pt 개선" deltaTone="up" icon={<Icon name="calendar-x" size={18} />} />
        </div>

        <p className="lbl">표와 페이지네이션</p>
        <Table
          columns={[
            { key: "name", header: "학생", strong: true, render: (v, r) => (
              <span style={{ display: "inline-flex", alignItems: "center", gap: 8 }}>
                <Avatar name={v} size={26} /> {v}
              </span>
            ) },
            { key: "sid", header: "학번" },
            { key: "dept", header: "근로 부서" },
            { key: "status", header: "상태", render: (v) => <StatusPill status={v} /> },
          ]}
          data={rows}
        />
        <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 14 }}>
          <Pagination page={page} pageCount={12} onChange={setPage} />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
