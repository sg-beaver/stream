<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  body { margin: 0; padding: 24px; background: var(--surface-page); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 20px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 560px; margin-bottom: 20px; }
  .lbl { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 10px; }
</style>

<body>
<div id="root"></div>
<script type="text/babel">
  const { Button, IconButton, Input, Textarea, Select, Checkbox, Radio, Switch, FormField, Icon, Badge } = window.STREAMDesignSystem_b095d7;
  function Demo() {
    const [avail, setAvail] = React.useState(true);
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        <div style={{ padding: "16px 18px", border: "1px solid var(--border-subtle)", borderRadius: "var(--radius-md)", background: "var(--surface-card)", boxShadow: "var(--shadow-sm)" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, marginBottom: 12 }}>
            <div>
              <div className="lbl" style={{ marginBottom: 4 }}>학생 지원 흐름</div>
              <div style={{ fontSize: 16, fontWeight: 800, color: "var(--text-strong)" }}>근로 지원서 작성</div>
            </div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <Badge tone="success" dot>모집중</Badge>
              <Badge tone="brand">마감 9/15</Badge>
            </div>
          </div>
          <div className="row" style={{ marginBottom: 0 }}>
            <Button variant="primary">지원서 제출</Button>
            <Button variant="secondary" iconLeft={<Icon name="download" size={16} />}>양식 다운로드</Button>
            <Button variant="ghost">임시 저장</Button>
            <Button variant="danger">지원 취소</Button>
          </div>
        </div>

        <p className="lbl">입력</p>
        <div className="grid2">
          <FormField label="학번" required>
            <Input placeholder="20241234" />
          </FormField>
          <FormField label="검색">
            <Input iconLeft={<Icon name="search" size={15} />} placeholder="학생 찾기" />
          </FormField>
          <FormField label="근로 부서">
            <Select defaultValue="lib"><option value="lib">중앙도서관</option><option value="it">IT 헬프데스크</option></Select>
          </FormField>
          <FormField label="이메일" error="올바른 주소를 입력해 주세요">
            <Input invalid defaultValue="student@" />
          </FormField>
        </div>
        <div style={{ maxWidth: 560, marginBottom: 20 }}>
          <FormField label="지원 사유">
            <Textarea rows={2} placeholder="교내 근로가 필요한 이유를 적어 주세요" />
          </FormField>
        </div>

        <p className="lbl">선택</p>
        <div className="row" style={{ gap: 24 }}>
          <Checkbox label="개인정보 이용 동의" defaultChecked />
          <Radio name="shift" label="오전 근무" defaultChecked />
          <Radio name="shift" label="오후 근무" />
          <Switch checked={avail} onChange={e => setAvail(e.target.checked)} label="근로 가능" />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
