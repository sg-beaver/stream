<div id="root"></div>
<script type="text/babel">
  const { Alert, Dialog, EmptyState, Button, Icon, Card } = window.STREAMDesignSystem_b095d7;
  function Demo() {
    const [open, setOpen] = React.useState(false);
    return (
      <div>
        <p className="lbl">알림</p>
        <div className="stack">
          <Alert tone="info" icon={<Icon name="info" size={18} />} title="학기 일정이 공개되었습니다">2025학년도 2학기 근로 시간표가 '근로 시간표' 메뉴에서 확인할 수 있습니다.</Alert>

          <Alert tone="success" icon={<Icon name="check-circle-2" size={18} />}>출석 체크가 09:02에 완료되었습니다.</Alert>

        </div>

        <p className="lbl">대화상자</p>
        <div className="stack" style={{ flexDirection: "row" }}>
          <Button variant="danger" onClick={() => setOpen(true)}>지원 취소하기…</Button>
        </div>
        <Dialog open={open} title="지원 취소 확인" onClose={() => setOpen(false)}
