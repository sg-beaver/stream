<!-- @dsCard group="간격" viewport="700x170" name="모서리와 그림자" subtitle="부드러운 코너와 미세한 그림자 표현" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--surface-page); font-family: var(--font-sans); }
  .wrap { display: flex; gap: 30px; align-items: flex-start; }
  .set { display: flex; gap: 14px; }
  .box { width: 60px; height: 60px; background: var(--surface-card); border: 1px solid var(--border-subtle); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 5px; }
  .n { font-family: var(--font-mono); font-size: 9px; color: var(--text-muted); }
  .col-h { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 10px; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <p class="col-h">Radius</p>
    <div class="set">
      <div class="box" style="border-radius:var(--radius-xs)"><span class="n">xs 3</span></div>
      <div class="box" style="border-radius:var(--radius-sm)"><span class="n">sm 5</span></div>
      <div class="box" style="border-radius:var(--radius-md)"><span class="n">md 7</span></div>
      <div class="box" style="border-radius:var(--radius-lg)"><span class="n">lg 10</span></div>
      <div class="box" style="border-radius:var(--radius-xl)"><span class="n">xl 14</span></div>
    </div>
  </div>
  <div>
    <p class="col-h">Elevation</p>
    <div class="set">
      <div class="box" style="border-radius:var(--radius-md); box-shadow:var(--shadow-xs); border-color:transparent"><span class="n">xs</span></div>
      <div class="box" style="border-radius:var(--radius-md); box-shadow:var(--shadow-sm); border-color:transparent"><span class="n">sm</span></div>
      <div class="box" style="border-radius:var(--radius-md); box-shadow:var(--shadow-md); border-color:transparent"><span class="n">md</span></div>
      <div class="box" style="border-radius:var(--radius-md); box-shadow:var(--shadow-lg); border-color:transparent"><span class="n">lg</span></div>
    </div>
  </div>
</div>
</body>
</html>
