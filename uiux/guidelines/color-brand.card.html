<!-- @dsCard group="색상" viewport="700x210" name="브랜드 컬러 — 서강 레드" subtitle="교표에서 영감을 받은 레드 톤과 실버 팔레트" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--surface-card); font-family: var(--font-sans); }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .sw { border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border-subtle); }
  .chip { height: 60px; }
  .meta { padding: 7px 9px; }
  .name { font-size: 11px; font-weight: 600; color: var(--text-strong); }
  .hex { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); text-transform: uppercase; }
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--sogang-red-50)"></div><div class="meta"><div class="name">red-50</div><div class="hex">#FBEAEA</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--sogang-red-100)"></div><div class="meta"><div class="name">red-100</div><div class="hex">#F5D3D4</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--sogang-red)"></div><div class="meta"><div class="name">red · base</div><div class="hex">#B01116</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--sogang-red-600)"></div><div class="meta"><div class="name">red-600</div><div class="hex">#A6141A</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--sogang-red-700)"></div><div class="meta"><div class="name">red-700</div><div class="hex">#8E0D12</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--sogang-silver)"></div><div class="meta"><div class="name">silver</div><div class="hex">#B3B5B8</div></div></div>
</div>
</body>
</html>
