<!-- @dsCard group="간격" viewport="700x230" name="간격 스케일" subtitle="4px 기본 격자와 space-1~12 치수" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); font-family: var(--font-sans); }
  .r { display: flex; align-items: center; gap: 14px; padding: 4px 0; }
  .tag { width: 110px; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); flex: 0 0 auto; }
  .bar { height: 14px; background: var(--sogang-red); border-radius: 2px; }
  .px { font-size: 11px; color: var(--text-subtle); font-family: var(--font-mono); }
</style>
</head>
<body>
  <div class="r"><span class="tag">space-2</span><span class="bar" style="width:4px"></span><span class="px">4px</span></div>
  <div class="r"><span class="tag">space-3</span><span class="bar" style="width:8px"></span><span class="px">8px</span></div>
  <div class="r"><span class="tag">space-4</span><span class="bar" style="width:12px"></span><span class="px">12px</span></div>
  <div class="r"><span class="tag">space-5</span><span class="bar" style="width:16px"></span><span class="px">16px</span></div>
  <div class="r"><span class="tag">space-7</span><span class="bar" style="width:24px"></span><span class="px">24px</span></div>
  <div class="r"><span class="tag">space-8</span><span class="bar" style="width:32px"></span><span class="px">32px</span></div>
  <div class="r"><span class="tag">space-10</span><span class="bar" style="width:48px"></span><span class="px">48px</span></div>
  <div class="r"><span class="tag">space-12</span><span class="bar" style="width:80px"></span><span class="px">80px</span></div>
</body>
</html>
