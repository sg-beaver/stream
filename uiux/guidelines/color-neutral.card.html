<!-- @dsCard group="색상" viewport="700x210" name="중립 컬러" subtitle="표면·경계·본문에 쓰는 차가운 중성 톤" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--surface-card); font-family: var(--font-sans); }
  .row { display: grid; grid-template-columns: repeat(11, 1fr); gap: 6px; }
  .sw { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .chip { width: 100%; height: 66px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle); }
  .name { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--neutral-0)"></div><div class="name">0</div></div>
  <div class="sw"><div class="chip" style="background:var(--neutral-25)"></div><div class="name">25</div></div>
  <div class="sw"><div class="chip" style="background:var(--neutral-50)"></div><div class="name">50</div></div>
  <div class="sw"><div class="chip" style="background:var(--neutral-100)"></div><div class="name">100</div></div>
  <div class="sw"><div class="chip" style="background:var(--neutral-200)"></div><div class="name">200</div></div>
  <div class="sw"><div class="chip" style="background:var(--neutral-300)"></div><div class="name">300</div></div>
  <div class="sw"><div class="chip" style="background:var(--neutral-400)"></div><div class="name">400</div></div>
  <div class="sw"><div class="chip" style="background:var(--neutral-500)"></div><div class="name">500</div></div>
  <div class="sw"><div class="chip" style="background:var(--neutral-600)"></div><div class="name">600</div></div>
  <div class="sw"><div class="chip" style="background:var(--neutral-700)"></div><div class="name">700</div></div>
  <div class="sw"><div class="chip" style="background:var(--neutral-900)"></div><div class="name">900</div></div>
</div>
</body>
</html>
