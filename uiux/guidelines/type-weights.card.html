<!DOCTYPE html>
<html lang="en">
<head>

  .w { text-align: center; }

<body>
<div class="row">

  <div class="w"><div class="g" style="font-weight:600;">Aa 서강</div><div class="n">600 SemiBold</div></div>
  <div class="w"><div class="g" style="font-weight:700;">Aa 서강</div><div class="n">700 Bold</div></div>
  <div class="w"><div class="g" style="font-weight:800;">Aa 서강</div><div class="n">800 ExtraBold</div></div>
