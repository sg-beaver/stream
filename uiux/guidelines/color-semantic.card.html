<!-- @dsCard group="색상" viewport="700x200" name="의미형 상태 컬러" subtitle="성공·주의·위험·정보에 쓰는 상태 톤" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--surface-card); font-family: var(--font-sans); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .grp { border: 1px solid var(--border-subtle); border-radius: var(--radius-md); overflow: hidden; }
  .base { height: 48px; display: flex; align-items: center; padding: 0 12px; color: #fff; font-size: 12px; font-weight: 700; }
  .tints { display: flex; height: 26px; }
  .tints div { flex: 1; }
  .meta { padding: 8px 12px; }
  .name { font-size: 12px; font-weight: 600; color: var(--text-strong); }
  .hex { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }
</style>
</head>
<body>
<div class="row">
  <div class="grp"><div class="base" style="background:var(--success)">Success</div><div class="tints"><div style="background:var(--success-50)"></div><div style="background:var(--success-100)"></div></div><div class="meta"><div class="name">success</div><div class="hex">#1F7A45</div></div></div>
  <div class="grp"><div class="base" style="background:var(--warning)">Warning</div><div class="tints"><div style="background:var(--warning-50)"></div><div style="background:var(--warning-100)"></div></div><div class="meta"><div class="name">warning</div><div class="hex">#B26A00</div></div></div>
  <div class="grp"><div class="base" style="background:var(--danger)">Danger</div><div class="tints"><div style="background:var(--danger-50)"></div><div style="background:var(--danger-100)"></div></div><div class="meta"><div class="name">danger</div><div class="hex">#B01116</div></div></div>
  <div class="grp"><div class="base" style="background:var(--info)">Info</div><div class="tints"><div style="background:var(--info-50)"></div><div style="background:var(--info-100)"></div></div><div class="meta"><div class="name">info</div><div class="hex">#1F5FA8</div></div></div>
</div>
</body>
</html>
