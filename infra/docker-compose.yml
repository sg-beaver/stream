# 로컬 개발용 PostgreSQL (이슈 #49)
# 사용법: infra/ 디렉토리에서  docker compose up -d
# 접속 정보는 backend/.env.example의 DATABASE_URL과 동일하다.
services:
  db:
    image: postgres:16
    container_name: stream-db
    environment:
      POSTGRES_USER: stream_user
      POSTGRES_PASSWORD: stream_pass
      POSTGRES_DB: stream_db
    ports:
      - "5432:5432"
    volumes:
      - stream-db-data:/var/lib/postgresql/data

volumes:
  stream-db-data:
