<svg xmlns="http://www.w3.org/2000/svg" width="680" height="730" viewBox="0 0 680 730" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}.gray .th{fill:#2C2C2A}.gray .ts{fill:#5F5E5A}
.purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}.purple .th{fill:#3C3489}.purple .ts{fill:#534AB7}
.teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}
.arr{stroke:#5F5E5A;stroke-width:.5;fill:none}
</style></defs>

<rect id="bg" x="0" y="0" width="680" height="730" fill="#FFFFFF"/>

<g class="gray"><rect x="147" y="40" width="180" height="44" rx="4"/><text class="th" x="163" y="68">사용자 (브라우저)</text></g>

<rect x="30" y="110" width="414" height="570" rx="4" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/><text class="ts" x="42" y="128">VPC</text>
<rect x="44" y="140" width="386" height="430" rx="4" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/><text class="ts" x="56" y="158">EC2 (application server)</text>

<line class="arr" x1="237" y1="84" x2="237" y2="166" marker-end="url(#arrow)"/>

<g class="gray"><rect x="60" y="172" width="354" height="52" rx="4"/><text class="th" x="76" y="196">nginx</text><text class="ts" x="76" y="214">listen 80 · TLS 미구성</text></g>

<line class="arr" x1="125" y1="224" x2="125" y2="254" marker-end="url(#arrow)"/><text class="ts" x="131" y="245">/</text>
<line class="arr" x1="310" y1="224" x2="310" y2="254" marker-end="url(#arrow)"/><text class="ts" x="316" y="245">/api/*</text>

<g class="gray"><rect x="60" y="256" width="130" height="52" rx="4"/><text class="th" x="74" y="280">React 빌드</text><text class="ts" x="74" y="298">정적 파일</text></g>

<rect x="206" y="256" width="208" height="290" rx="4" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/><text class="th" x="220" y="280">uvicorn · FastAPI</text><text class="ts" x="220" y="298">단일 프로세스 (--workers 1)</text>

<g class="purple"><rect x="220" y="312" width="180" height="46" rx="4"/><text class="th" x="232" y="332">routers/</text><text class="ts" x="232" y="350">인증 · 권한 · 경계</text></g>
<g class="purple"><rect x="220" y="368" width="180" height="46" rx="4"/><text class="th" x="232" y="388">CP-SAT 엔진</text><text class="ts" x="232" y="406">OR-Tools · 동기 실행</text></g>
