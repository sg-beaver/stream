<g class="purple"><rect x="220" y="480" width="180" height="46" rx="4"/><text class="th" x="232" y="500">공용 검증</text><text class="ts" x="232" y="518">겹침 · 상한 · 개관</text></g>

<g class="teal"><rect x="60" y="368" width="130" height="46" rx="4"/><text class="th" x="74" y="388">정책 JSON</text><text class="ts" x="74" y="406">로컬 파일</text></g>
<line class="arr" x1="190" y1="391" x2="216" y2="391" marker-end="url(#arrow)"/>

<line class="arr" x1="310" y1="546" x2="310" y2="598" marker-end="url(#arrow)"/>
<g class="teal"><rect x="210" y="600" width="200" height="52" rx="4"/><text class="th" x="226" y="624">RDS PostgreSQL</text><text class="ts" x="226" y="642">VPC 내부 전용</text></g>

<path class="arr" d="M400 447 L555 447 L555 598" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<g class="teal"><rect x="470" y="600" width="170" height="52" rx="4"/><text class="th" x="486" y="624">Gemini API</text><text class="ts" x="486" y="642">외부 API 호출</text></g>

